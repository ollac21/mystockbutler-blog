name: Build and deploy blog mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # SEO row 1 (owner 2026-11-07): the analysts' view is refreshed once a day, not at every 30-minute build. The day's fetch is
      # cached under the UTC date: a build on a cache hit restores it; the first build of a new UTC day misses, asks FMP
      # (scripts/fetchAnalysts.mjs, the key only from the secret) and saves the day. A failed or thin fetch (continue-on-error,
      # exit 1 under half the files) is NOT saved, so the next build tries again; either way the build runs with the files
      # committed in data/stocks/analysts/ and analysts.mjs draws nothing from a file older than 14 days.
      - name: Day key for the analysts' cache
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore the day's analyst files
        id: analysts-cache
        uses: actions/cache/restore@v4
        with:
          path: data/stocks/analysts
          key: analysts-${{ steps.day.outputs.date }}

      - name: Fetch the analyst files (once a day)
        id: analysts-fetch
        if: steps.analysts-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: node scripts/fetchAnalysts.mjs
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          STOCK_PAGES_URL: https://app.mystockbutler.com/functions/getPublicStockPages

      - name: Save the day's analyst files
        if: steps.analysts-cache.outputs.cache-hit != 'true' && steps.analysts-fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/stocks/analysts
          key: analysts-${{ steps.day.outputs.date }}

      - name: Render published posts
        run: node scripts/render.mjs
        env:
          OUT_DIR: _site
          # B112: the stock pages' files through the app's public function; a failed fetch keeps data/stocks/.
          STOCK_PAGES_URL: https://app.mystockbutler.com/functions/getPublicStockPages

      - uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report
          if-no-files-found: ignore

      # IndexNow: compare the freshly built state with the one the LIVE site publishes now. This has to
      # happen here, before the deploy replaces the live site. Best effort: never fails the build.
      - name: Plan IndexNow notifications (new or changed pages only)
        run: node scripts/indexnow.mjs plan
        env:
          OUT_DIR: _site
          INDEXNOW_PLAN_DIR: indexnow-plan

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-plan
          path: indexnow-plan
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After the deploy: tell IndexNow (Bing, and through it ChatGPT search and Copilot) about the pages
  # the plan found new or changed. A failure here never fails the workflow.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: indexnow-plan
          path: indexnow-plan

      - name: Notify IndexNow
        run: node scripts/indexnow.mjs ping
        env:
          INDEXNOW_PLAN_DIR: indexnow-plan
